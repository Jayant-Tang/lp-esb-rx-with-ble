# ESB with built-in MPSL Timeslot support (NCS v3.3.0+)
# CONFIG_ESB_MPSL_TIMESLOT handles radio coexistence with BLE internally,
# replacing the manual timeslot management required in v2.9.0.
# TIMER10 is shared between ESB and MPSL (required on nRF54L15).
CONFIG_ESB=y
CONFIG_ESB_MPSL_TIMESLOT=y
CONFIG_ESB_CLOCK_INIT=y
CONFIG_CLOCK_CONTROL=y

CONFIG_MPSL_TIMESLOT_SESSION_COUNT=2

# Low-power PRX: 5 ms listen window every 500 ms.
# Requires sdk_changes/v3.3.0 patch applied to nrf/subsys/esb/esb.c.
CONFIG_APP_ESB_MPSL_TIMESLOT_RX_INTERVAL_US=500000
CONFIG_APP_ESB_MPSL_TIMESLOT_RX_WINDOW_US=5000

CONFIG_RING_BUFFER=y
